<section id="about" class="wrap">
  <div class="section-head">
    <p class="eyebrow">{{ .Site.Data.testimonials.eyebrow }}</p>
    <h2>{{ .Site.Data.testimonials.heading }}</h2>
  </div>
  <div class="testimonial-grid">
    {{ range .Site.Data.testimonials.quotes }}
    <blockquote class="testimonial">
      <p>{{ . }}</p>
    </blockquote>
    {{ end }}
  </div>
</section>
