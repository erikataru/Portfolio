<footer class="contact" id="contact">
  <canvas data-contour="horizon" data-seed="11" aria-hidden="true"></canvas>
  <div class="wrap contact-inner">
    <p class="eyebrow on-deep">{{ .Site.Data.contact.eyebrow }}</p>
    <h2>{{ .Site.Data.contact.heading }}</h2>
    <p class="contact-sub">{{ .Site.Data.contact.subtext }}</p>
    <dl class="contact-rows">
      <div class="contact-row"><dt>Email</dt><dd><a href="mailto:{{ .Site.Data.contact.email }}">{{ .Site.Data.contact.email }}</a></dd></div>
      <div class="contact-row"><dt>Phone</dt><dd><a href="{{ .Site.Data.contact.phone_href }}">{{ .Site.Data.contact.phone }}</a></dd></div>
      <div class="contact-row"><dt>LinkedIn</dt><dd><a href="{{ .Site.Data.contact.linkedin_url }}">{{ .Site.Data.contact.linkedin }}</a></dd></div>
    </dl>
    <p class="foot-meta">{{ .Site.Data.contact.copyright }}</p>
  </div>
</footer>
