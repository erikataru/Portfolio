<a class="card" href="{{ .RelPermalink }}">
  {{ with .Params.cover }}{{ with $.Resources.Get . }}
    <img src="{{ .RelPermalink }}" alt="{{ $.Title }}" loading="lazy">
  {{ end }}{{ end }}
  <div class="card-body">
    <h3>{{ .Title }}</h3>
    {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
  </div>
</a>
