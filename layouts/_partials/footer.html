<footer class="site-footer container">
  <p>© {{ now.Year }} {{ site.Params.name }}</p>
  <ul class="social">
    {{ with site.Params.email }}<li><a href="mailto:{{ . }}">Email</a></li>{{ end }}
    {{ range site.Params.social }}
      <li><a href="{{ .url }}" rel="noopener" target="_blank">{{ .name }}</a></li>
    {{ end }}
  </ul>
</footer>
