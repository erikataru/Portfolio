# ---------------------------------------------------------------
# Front page content: name, hero, intro text, and quick facts.
# ---------------------------------------------------------------

name: "Erika Ojanperä"

# The name as it's displayed in the big hero title. Each line becomes
# its own line on the page (keep it to first name / last name).
name_lines:
  - "Erika"
  - "Ojanperä"

tagline: "Human-Centered Strategist"

# Profile photo. Put the image file in static/images/ and reference
# it here (path relative to static/).
photo: "images/profile.jpg"
photo_alt: "Erika Ojanperä"

# Button under the hero text.
hero_cta:
  text: "See how I work"
  anchor: "vision"   # scrolls to the section with this id

# Menu at the top of the page. "anchor" must match a section id
# (bio, vision, projects, about, contact).
nav:
  - label: "Bio"
    anchor: "bio"
  - label: "Vision"
    anchor: "vision"
  - label: "Projects"
    anchor: "projects"
  - label: "About"
    anchor: "about"
  - label: "Contact"
    anchor: "contact"

# Introduction paragraphs, shown left of the "Any super powers?" notes.
# Add or remove paragraphs freely — each list item is its own paragraph.
bio_paragraphs:
  - "I help organizations turn strategy into action, navigate change, solve complex problems, and build processes that improve performance for both people and business."
  - "My strength is connecting the dots between strategy, people, and execution. I bring structure to complex situations, identify opportunities for improvement, and help turn ideas into solutions that actually work. With an entrepreneurial mindset, I am at my comfort zone both seeing the bigger picture and getting my hands dirty."
  - "I am a highly creative person and a fast learner, and I use both deliberately in problem solving. My personal motto is “Where there’s a will, there’s a way.” I genuinely believe that even the most complex challenges can be solved when there is the curiosity, creativity, and determination to find the way forward. My diverse background enables me to create value across strategy and change consulting, business development, project management, and client success roles. I also bring experience in data analysis and AI tools to improve decision-making and find smarter ways of working."
  - " I highly value being useful to the people around me. I am the person who is happy to jump in when an extra pair of hands is needed, spar with you when you're stuck with a work challenge or offer a fresh perspective when you need one. And yes, if what you need is a tip for your next gym session, I'm there for that too. I genuinely enjoy helping people which has led me to several volunteer positions."

  

# Short Q&A notes shown on the right side of the intro.
field_notes:
  - question: "Any super powers?"
    answer: "Yes! What sets me apart is the combination of emotional intelligence, creative problem solving, and a great sense of humor. I crave to understand what helps people to perform at their best and how leadership, wellbeing, and organizational culture can become drivers of sustainable performance and competitive advantage."
  - question: "How about work-life balance?"
    answer: "I'm a keen believer in work-life balance and being driven by curiosity in all areas of life. Outside of the office you'll find me practicing partner acrobatics and other sports, exploring the outdoors, or getting my hands dirty with climate & animal rights activism."

# Big numbers shown below the intro. Add or remove entries freely.
key_stats:
  - value: "10+"
    label: "Organizations transformed"
  - value: "2+"
    label: "Years in change management & strategy development"
  - value: "3+"
    label: "Years of startup experience"
