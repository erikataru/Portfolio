    title: "Consulting"
    subtitle: "Strategy, Change & Organizational Development"
    description:
      - "I have experience in strategy development, change management, process development, and facilitation across different organizations and industries. My approach combines human-centered research, analytical thinking, strategic perspective, and practical implementation. I have worked with both large organizations and smaller companies, taking responsibility for everything from research and analysis to workshop design, facilitation, project management, and implementation."
      - "I draw on my earlier experience in business analysis, research, and data-driven development to bring an analytical perspective to my consulting work. At the same time, my extensive experience in facilitation helps me turn insights into shared understanding and meaningful action. I am comfortable taking ownership in ambiguous environments and approaching challenges with an entrepreneurial mindset — figuring out what needs to be done and driving it forward independently."
