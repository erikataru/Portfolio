  - number: "02"
    title: "Business Development"
    subtitle: "Turning Ideas Into Structured Processes & Ways of Working"
    description:
      - "My business development experience combines strategic thinking with hands-on execution. I have developed services and internal ways of working, coordinated development projects, implemented OKRs, and worked directly with customers and stakeholders. I enjoy turning complex development needs into concrete structures, services, and solutions that can actually be implemented."
    achievements:
      - name: "Academy of Brain — OKR implementation & service development"
        text: "I coordinated business and service development projects and led the implementation of an OKR model into the company's development work. I also structured the company's service portfolio to create a shared view of the company's offering, making it easier to understand, communicate, and develop across the business."
      - name: "Academy of Brain — Facilitation services"
        text: "I developed the company's facilitation offering to help customers create stronger impact and progress in their teams. I designed and facilitated customer sessions while also shaping the service together with the business. As an example, I independently created and launched a webinar-style discussion concept for HR leaders, taking responsibility for the full delivery. I acted as project lead and product owner, while also creating the content, hosting the sessions, and facilitating the discussions, turning an idea into a new, repeatable customer-facing service."
      - name: "Junction — Team leading and process development"
        text: "As Head of Participants, I led a five-person team responsible for the participant experience, marketing and communications, budget, application process, and its technical development. Together with the Tech Lead, I redesigned and significantly improved the application process, enabling the team to review every application for the first time. This made the selection process more efficient, transparent, and equitable. I also identified and automated several manual processes, reducing the workload and streamlining the overall operation."

  - number: "03"
    title: "Marketing & Communications"
    subtitle: "Making Marketing More Strategic, Systematic & Engaging"
    description:
      - "Alongside my consulting and business development work, I have supported organizations in developing and executing their marketing and communications. This has included strategic marketing planning, content creation, social media, communications, WordPress, and data analysis. I have combined my strategic understanding of the business with hands-on execution, creating impactful marketing and communications."
    achievements:
      - name: "ICG Innotiimi — Strategic marketing development"
        text: "I helped develop marketing into a more strategic and systematic function through strategic planning, content creation, data analysis, and collaboration across the international ICG network. One example of the value I brought was my ability to quickly learn new technical tools and turn them into practical opportunities: I independently learned what was needed to produce podcasts and helped introduce podcasting as a new format in our marketing portfolio."
      - name: "Academy of Brain — Improving customer experience"
        text: "Alongside service and business development, I helped strengthen how the company connected customer needs, content, and business objectives across social media, communications, and customer experience. I also used graphic design to clarify and improve the service portfolio, making the offering more coherent, understandable, and appealing to customers."
    additional_intro: "Additionally, writing is one of my strongest tools for sharing my views and communicating ideas. I have published several opinion pieces in Helsingin Sanomat and written an essay at Noren on curious organizations."
