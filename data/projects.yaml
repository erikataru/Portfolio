# ---------------------------------------------------------------
# "Projects & Achievements" section.
#
# Each item under "categories" is one numbered block (01, 02, 03 ...).
# A category can list its achievements in two ways — use whichever
# fits, or mix both in the same category:
#
#   cases:         a detailed case study with Challenge / My role / Impact
#   achievements:  a simpler entry with just a name and one paragraph
#
# A category can also end with an "additional" list — a short
# company + one-line description, shown as a compact two-column list.
# Leave out "cases", "achievements" or "additional" entirely if a
# category doesn't need them.
# ---------------------------------------------------------------

heading: "Projects & Achievements"

categories:
  - number: "01"
    title: "Consulting"
    subtitle: "Strategy, Change & Organizational Development"
    description:
      - "I have experience in strategy development, change management, process development, and facilitation across different organizations and industries. I have worked with both large organizations and smaller companies, taking responsibility for everything from research and analysis to workshop design, facilitation, project management, and implementation."
      - "I draw on my earlier experience in business analysis, research, and data-driven development to bring an analytical perspective to my consulting work. At the same time, my extensive experience in facilitation helps me turn insights into shared understanding and successful implementation. I am comfortable taking ownership in fast-paced environments and approaching challenges with an entrepreneurial mindset: figuring out what needs to be done and driving it forward independently."
    cases:
      - name: "KPMG — Human-centered strategy development"
        challenge: "Developing a new strategy in a complex organizational situation, where creating understanding and commitment across the organization was essential for successful implementation."
        role: "I contributed throughout the strategy process: conducting interviews, performing organizational and customer research, supporting in the strategy process, and designing and facilitating workshops. I also sparred with client teams in their strategy process work."
        impact: "Through deep organizational and customer research, we developed a strategy that was clearer and easier for people to understand and relate to, creating a stronger foundation for implementation."
      - name: "Wärtsilä — Strategic ways of working & OKRs"
        challenge: "Supporting Product Owners in developing their strategic capabilities and applying strategy in their everyday work."
        role: "Together with a colleague, I designed and delivered a development program focused on strategic thinking and OKRs. I brought structure and practical tools to an otherwise abstract topic, translating strategic concepts into practices that Product Owners could apply in their daily work. I was particularly responsible for designing and facilitating the workshops and for bridging the gap between learning and practice."
        impact: "The project helped align and strengthen teams’ understanding of strategic work and improved the quality of their product strategies. What started with one team was expanded to four teams following positive client feedback and demonstrated results."
    additional_intro: "Additional organizations and projects, where I have contributed in:"
    additional:
