      - name: "Academy of Brain — Marketing & customer experience"
        text: "Alongside service and business development, I worked with social media, communications, customer experience, and the marketing of digital learning services — gaining hands-on experience connecting customer needs, content, and business objectives, and improving the service portfolio through graphic design."
