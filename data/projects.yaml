  - number: "02"
    title: "Business Development"
    subtitle: "Turning Ideas Into Structured Processes & Ways of Working"
    description:
      - "My business development experience combines strategic thinking with hands-on execution. I have developed services and internal ways of working, coordinated development projects, implemented OKRs, and worked directly with customers and stakeholders. I enjoy turning ambiguous development needs into concrete structures, services, and solutions that people can actually use."
    achievements:
      - name: "Academy of Brain — OKR implementation & service development"
        text: "I coordinated business and service development projects and led the implementation of an OKR model into the company's development work. I also mapped and structured the company's service portfolio, making the overall offering more visible and understandable across the organization."
      - name: "Academy of Brain — Facilitation services"
        text: "I was responsible for developing and delivering the company's team facilitation offering. I designed and facilitated customer sessions and developed the service together with the business — including an independently created and launched webinar-style discussion concept for HR leaders, where I acted as project lead, product owner, speaker, and facilitator, taking the concept from idea to execution."
      - name: "Junction — Team leading and process development"
        text: "As Head of Participants, I led a five-person team and was responsible for the participant experience, marketing and communications, budget, application process, and its technical development. Together with the Tech Lead, I significantly automated and improved the application process — for the first time, all applications could be reviewed, making the process more efficient and equal."

