        challenge: "Developing a new strategy in a complex organizational situation, where creating understanding and commitment across the organization was essential for successful implementation."
        role: "I contributed throughout the strategy process — conducting interviews, analyzing organizational and customer research, developing the strategy, and designing and facilitating workshops. I also sparred with client teams in their strategy development work."
        impact: "Through deep organizational and customer research, we developed a strategy that was clearer and easier for people to understand and relate to, creating a stronger foundation for implementation."
      - name: "Wärtsilä — Strategic ways of working & OKRs"
